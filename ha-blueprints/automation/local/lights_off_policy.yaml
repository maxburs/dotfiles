blueprint:
  name: Lights off policy
  description: >-
    Keep listed lights off during their off hours, every day. When a light's
    range starts, it turns off if it's on. Buttons that turn lights on through
    this automation skip lights inside their range. A light is exempt while
    Adaptive Lighting has it under manual control (for example after a
    full-white override), or while every Adaptive Lighting profile in its area
    that could manage it is off or has Adapt Brightness off. The end of a range
    never turns a light on.

    To turn lights on through this automation, call `automation.trigger` with
    `variables: {room: <area ID>}` or `variables: {light: <entity ID>}`. While
    this automation is off, ranges don't start and requests turn lights on
    normally.

    Adaptive Lighting profiles are found through the light's area. To exempt a
    light by turning off just its own profile when its area has several, or to
    ignore color-only overrides under `pause_changed`, enable
    `include_config_in_attributes` on those profiles.
  domain: automation
  homeassistant:
    min_version: "2026.11.0"
  input:
    ranges:
      name: Lights and off hours
      description: >-
        Ranges can cross midnight. Add more than one row for a light to give it
        more than one range.
      selector:
        object:
          multiple: true
          label_field: light
          fields:
            light:
              label: Light
              required: true
              selector:
                entity:
                  filter:
                    domain: light
            from:
              label: Off from
              required: true
              selector:
                time: {}
            until:
              label: Off until
              required: true
              selector:
                time: {}

mode: parallel
trigger_variables:
  ranges: !input ranges
triggers:
  # A template trigger fires only when it becomes true. Splitting even and odd
  # minutes catches ranges that start in consecutive minutes.
  - trigger: template
    id: start
    value_template: >-
      {{ now().minute % 2 == 0 and ranges | map(attribute='from') | map('string')
         | select('search', '^' ~ now().strftime('%H:%M')) | list | count > 0 }}
  - trigger: template
    id: start
    value_template: >-
      {{ now().minute % 2 == 1 and ranges | map(attribute='from') | map('string')
         | select('search', '^' ~ now().strftime('%H:%M')) | list | count > 0 }}

actions:
  - variables:
      starting: "{{ trigger.id is defined and trigger.id == 'start' }}"
      area: "{{ room | default('') }}"
      lamp: "{{ light | default('') }}"
      # Lights whose range starts now (for the trigger) or includes now (for requests),
      # minus exempt ones: under Adaptive Lighting manual control, or every profile in
      # the light's area that could manage it is off or has Adapt Brightness off.
      skipped: >-
        {% set hm = now().strftime('%H:%M') %}
        {% set ns = namespace(lights=[], hits=[]) %}
        {% for r in ranges %}
          {% set a = (r['from'] | string)[:5] %}
          {% set b = (r['until'] | string)[:5] %}
          {% set inside = (a <= hm and hm < b) if a < b else (hm >= a or hm < b) %}
          {% set hit = (hm == a) if starting else (inside and this.state != 'off') %}
          {% if hit %}
            {% set ns.lights = ns.lights + [r['light']] %}
          {% endif %}
        {% endfor %}
        {% set al = integration_entities('adaptive_lighting') %}
        {% for light in ns.lights | unique %}
          {% set area = area_id(light) %}
          {% set profiles = expand(al | select('in', area_entities(area)) | list)
               | selectattr('domain', 'eq', 'switch')
               | selectattr('attributes.configuration', 'defined') | list if area else [] %}
          {% set st = namespace(manual=false, candidates=0, disabled=0) %}
          {% for p in profiles %}
            {% set config = p.attributes.configuration or {} %}
            {% set manual = p.attributes.get('manual_control_brightness'
                 if config.get('take_over_control_mode') == 'pause_changed' else 'manual_control') or [] %}
            {% set st.manual = st.manual or light in manual %}
            {# Without an exposed light list, any profile in the area might manage it. #}
            {% if light in config.get('lights', [light]) %}
              {% set dimmers = device_entities(device_id(p.entity_id)) | select('match', '^switch[.]')
                   | select('is_state_attr', 'icon', 'mdi:brightness-4') | list %}
              {% set st.candidates = st.candidates + 1 %}
              {% if p.state == 'off' or (dimmers | count == 1 and is_state(dimmers[0], 'off')) %}
                {% set st.disabled = st.disabled + 1 %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if not st.manual and (st.candidates == 0 or st.disabled < st.candidates) %}
            {% set ns.hits = ns.hits + [light] %}
          {% endif %}
        {% endfor %}
        {{ ns.hits | unique | list }}
  - choose:
      - alias: Turn off lights whose range starts now
        conditions: "{{ starting }}"
        sequence:
          - variables:
              lit: "{{ skipped | select('is_state', 'on') | list }}"
          - if: "{{ lit | count > 0 }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ lit }}"

      - alias: Reject a request without exactly one valid room or light
        conditions: >-
          {{ (area != '') == (lamp != '') or (area != '' and area not in areas())
             or (lamp != '' and (lamp is not string or not lamp.startswith('light.') or not has_value(lamp))) }}
        sequence:
          - stop: "Pass exactly one valid room (area ID) or available light (entity ID) in variables."
            error: true

      - alias: Turn on one light unless it's in its off hours
        conditions: "{{ lamp != '' }}"
        sequence:
          - if: "{{ lamp in skipped }}"
            then:
              - stop: "This light is in its off hours."
          - action: light.turn_on
            target:
              entity_id: "{{ lamp }}"

    default:
      - alias: Turn on a room, skipping lights in their off hours
        variables:
          room_lights: "{{ area_entities(area) | select('match', '^light[.]') | list }}"
          # Also hold back Home Assistant light groups that contain a skipped light.
          held: >-
            {% set ns = namespace(out=[]) %}
            {% for l in room_lights if expand(l) | map(attribute='entity_id') | select('in', skipped) | list %}
              {% set ns.out = ns.out + [l] %}
            {% endfor %}
            {{ ns.out }}
      - if: "{{ not held }}"
        then:
          - action: light.turn_on
            target:
              area_id: "{{ area }}"
        else:
          - if: "{{ room_lights | reject('in', held) | reject('is_hidden_entity') | list | count > 0 }}"
            then:
              # Adaptive Lighting ignores target exclusions and could still turn a held light on.
              # homeassistant.turn_on resolves the room the way Core does (skipping configuration
              # and hidden entities), then calls light.turn_on with only the resulting lights.
              - action: homeassistant.turn_on
                target: >-
                  {{ {'area_id': area, 'exclude': {'entity_id':
                       area_entities(area) | reject('match', '^light[.]') | list + held}} }}
